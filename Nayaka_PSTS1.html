             <div class="form-container">
        <h2>Extracurricular Registration Form</h2>
        <form action="post" method="post" dir="ltr" class="lrt-form">
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Female" required>
                <label for="female">Female</label>
            </div>
                <label>Class:</label>

              <div class="radio-group">
                <input type="radio" id="X" name="X" value="X" required>
                <label for="male">X</label>
                <input type="radio" id="XI" name="XI" value="XI" required>
                <label for="XI">XI</label>
                <input type="radio" id="XII" name="XII" value="XII" required>
                <label for="XII">XII</label>
            </div>

            <label for="Competition Category">Competition Category</label>
            <select id="Competition Category" name="Competition Category" required>
                <option value="">-- Select --</option>
                <option value="Futsal">Project IoT</option>
                <option value="Basketball">Web Developement</option>
                <option value="Scout">PhotoGraphy</option>
                <option value="Science Club">Public Speaking </option>
                <option value="Science Club">Graphic Design</option>
            </select>

                        <label>Participaiton type</label>
            <div class="radio-group">
                <input type="radio" id="Individual" name="Individual" value="Individual" required>
                <label for="Individual">Individual</label>
                <input type="radio" id="Team" name="Team" value="Team" required>
                <label for="Team">Team</label>
            </div>
                
             <label for="TeamName">TeamName:</label>
            <input type="text" id="TeamName" name="TeamName" required>

            <label for="ContactNumber">ContactNumber:</label>
            <input type="text" id="ContactNumber" name="ContactNumber" required>
            
            <label for="textarea" > Describe Your Project </label>
            <textarea> Describe Your Project </textarea>

          

            <div class="checkbox-group">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">I agree with terms and conditions</label>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </div>
